name: ci
on: [pull_request, push]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: if [ -f pipeline/pyproject.toml ]; then cd pipeline && uv run pytest -q; else echo "no pipeline yet"; fi
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: if [ -f web/package.json ]; then cd web && npm ci && npm test && npm run build; else echo "no web yet"; fi
