[project]
name = "ffpipe"
version = "0.1.0"
description = "Flame in Freefall data pipeline (lane W1)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffpipe"]

[tool.pytest.ini_options]
pythonpath = ["."]
